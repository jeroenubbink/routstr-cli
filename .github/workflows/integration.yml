name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily smoke at 06:00 UTC to catch upstream package drift.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-smoke:
    name: Install via ${{ matrix.runtime }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [bun, npm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (npm path only)
        if: matrix.runtime == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run integration smoke tests
        env:
          INTEGRATION_RUNTIME: ${{ matrix.runtime }}
        run: bash scripts/integration-test.sh
